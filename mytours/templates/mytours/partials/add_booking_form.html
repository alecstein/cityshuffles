<form method="post" action="{{ action_url }}" class="add-booking-form" data-booking-form>
    {% csrf_token %}
    <input type="hidden" name="return_url" value="{{ request.get_full_path }}">
    <div class="booking-form-errors" data-form-errors role="alert" {% if not add_form.errors %}hidden{% endif %}>{{ add_form.errors }}</div>
    <div class="booking-form-grid">
        <div class="booking-form-column">
            <label>Guest name {{ add_form.name }}</label>
            <label>Email {{ add_form.email }}</label>
            <label>Phone number {{ add_form.phone_number }}<small>{{ add_form.phone_number.help_text }}</small></label>
            <div class="add-booking-counts">
                <label>Adults {{ add_form.adults }}</label>
                <label>Kids {{ add_form.children }}</label>
            </div>
            <p class="booking-original-counts" data-original-counts hidden></p>
            <label>Special requests {{ add_form.special_requests }}</label>
            <label>Staff notes {{ add_form.tour_notes }}</label>
        </div>
        <div class="booking-form-column">
            <label>Tour {{ add_form.tour }}</label>
            <div class="add-booking-counts">
                <label>Date <input data-context="tour_date" type="date" readonly></label>
                <label>Time <input data-context="tour_time" type="time" readonly></label>
            </div>
            <label>Guide <input data-context="guide" readonly></label>
            <label>Vendor <input data-context="vendor" readonly></label>
            <div class="add-booking-counts">
                <label>Booking code <input data-context="booking_code" readonly></label>
                <label>Event ID <input data-context="event_id" readonly></label>
            </div>
            <label>Language {{ add_form.language }}</label>
        </div>
    </div>
    <div class="booking-modal-actions">
        <button type="submit" data-booking-submit>{% if submit_label %}{{ submit_label }}{% else %}Add booking{% endif %}</button>
        <button type="button" class="button-secondary" data-close-booking-modal>Cancel</button>
        <button type="submit" class="button-danger booking-delete-button" form="booking-delete-form" data-booking-delete {% if not delete_action_url %}hidden{% endif %}>Delete booking</button>
    </div>
</form>
