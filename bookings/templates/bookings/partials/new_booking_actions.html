<span class="new-booking-actions">
    <form method="post" action="{% url 'bookings:ignore_new_booking' vendor_booking.pk %}" class="chat-action-form new-booking-ignore-form">
        {% csrf_token %}
        <button type="submit" class="jump-link jump-link-ignore" aria-label="Ignore new booking from {{ vendor_booking.booking.full_name }}" title="Remove from new bookings">Ignore</button>
    </form>
    <span class="new-booking-edit-action">
        {% include "bookings/partials/edit_booking_button.html" with guest=vendor_booking.booking %}
    </span>
    {% include "bookings/partials/chat_button.html" with guest=vendor_booking.booking %}
</span>
